name: Build Binary

on:
  # The only way to publish. A tag push deliberately does not trigger this.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/build-binary.yml
      - binary.config.json
      - gateway.binary.config.json
      - plugins/langsmith-gateway/hooks/langsmith-gateway
      - plugins/langsmith-tracing/hooks/hooks.binary.json
      - macos-entitlements.plist
      - package.json
      - pnpm-lock.yaml
      - src/**

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@08ded89ff9ecd8ce1ed66632aac96285843a3374 # v0.6.0
    with:
      bun-version: 1.4.4
      binary-directory: plugins/langsmith-tracing/binary
    secrets:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.CSC_LINK }}

  gateway:
    needs: binary
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@a223f9093d825deddcb91de8f1dd657d9177f5d2 # a223f90
    with:
      config: gateway.binary.config.json
      bun-version: 1.4.4
      commit-binaries: false
      binary-test: test:gateway-binary
    secrets:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
