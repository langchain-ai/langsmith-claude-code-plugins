name: Build Binary

on:
  # The only way to publish. A tag push deliberately does not trigger this.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/build-binary.yml
      - binary.config.json
      - hooks/hooks.binary.json
      - macos-entitlements.plist
      - package.json
      - pnpm-lock.yaml
      - src/**

jobs:
  binary:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@988aaf6a478d7a95cfe015c8bac3f1c9c16ec3c7 # 988aaf6
    with:
      bun-version: 1.4.4
    secrets:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
