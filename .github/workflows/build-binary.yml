name: Build Binary

on:
  # The only way to publish. A tag push deliberately does not trigger this.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/build-binary.yml
      - langsmith-claude.binary.config.json
      - plugins/langsmith-gateway/hooks/langsmith-claude-launcher
      - plugins/langsmith-tracing/hooks/langsmith-claude-launcher
      - macos-entitlements.plist
      - package.json
      - pnpm-lock.yaml
      - src/**

jobs:
  langsmith-claude:
    permissions:
      contents: write
      pull-requests: write
    uses: langchain-ai/langsmith-plugin-binary/.github/workflows/build-binary.yml@95aa3266d739199943343acf6b1c88e45c92307b # v0.6.1
    with:
      config: langsmith-claude.binary.config.json
      bun-version: 1.4.4
      binary-directory: shared
      binary-test: test:bundle-binary
      bundle: true
    secrets:
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
