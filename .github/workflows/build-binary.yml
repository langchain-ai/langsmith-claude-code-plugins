name: Build Binary

on:
  # The only way to publish. A tag push deliberately does not trigger this.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/build-binary.yml
      - install.sh
      - esbuild.sea.config.mjs
      - sea-config.json
      - package.json
      - macos-entitlements.plist
      - src/hooks/dispatch.ts
      - src/hooks/dispatch.sea.test.ts
      - src/hooks/stand-down.ts
      - hooks/hooks.sea.json
      - src/install-sea.test.ts
      - src/installer.ts
      - scripts/sign.sea.mjs
      - src/sea-constants.ts
      - src/sea-models.ts
      - src/sea-runtime.ts
      - src/sign-sea.test.ts
      - src/updater.ts
      - src/updater-download.ts
      - src/updater-install.ts
      - src/updater-releases.ts
      - src/updater-utils.ts
      - src/utils/stdin.ts

permissions:
  contents: read

jobs:
  build-unsigned:
    name: Build Unsigned Binary
    runs-on: macos-26
    outputs:
      publishing: ${{ steps.release-gate.outputs.publishing }}
    steps:
      - name: Decide Whether the Build Is Being Released
        id: release-gate
        env:
          PUBLISHING: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: echo "publishing=$PUBLISHING" >> "$GITHUB_OUTPUT"
      - name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the Version Against the Tag
        if: steps.release-gate.outputs.publishing == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if [ "$VERSION" != "$TAG" ]; then
            echo "package.json is $VERSION but the tag is $TAG. Bump the version, then retag." >&2
            exit 1
          fi
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # --build-sea needs Node >= 25.5.
          node-version: 26.8.2
          architecture: arm64
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the Unsigned Binary
        run: pnpm build:sea
      - name: Test the Binary
        run: pnpm test src/hooks/dispatch.sea.test.ts src/install-sea.test.ts
      - name: Upload the Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: langsmith-claude-code-tracing-darwin-arm64-unsigned
          path: bin/langsmith-claude-code-tracing
          if-no-files-found: error

  sign-and-notarize:
    name: Sign and Notarize the Binary
    if: needs.build-unsigned.outputs.publishing == 'true'
    needs: build-unsigned
    runs-on: macos-26
    environment: macos-signing
    env:
      HAS_APPLE_CREDENTIALS: >-
        ${{ secrets.CSC_LINK != '' && secrets.CSC_KEY_PASSWORD != '' && secrets.APPLE_API_KEY != ''
        && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
    steps:
      - name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.2
          architecture: arm64
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the Unsigned Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: langsmith-claude-code-tracing-darwin-arm64-unsigned
          path: bin
      - name: Restore the Executable Bit
        run: chmod +x bin/langsmith-claude-code-tracing
      - name: Sign and Notarize the Binary
        if: env.HAS_APPLE_CREDENTIALS == 'true'
        run: pnpm sign:sea
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
      - name: Test the Signed Binary
        run: pnpm test src/hooks/dispatch.sea.test.ts src/install-sea.test.ts
      - name: Upload the Signed Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: langsmith-claude-code-tracing-darwin-arm64-unsigned
          path: bin/langsmith-claude-code-tracing
          overwrite: true
          if-no-files-found: error

  publish:
    name: Publish the Binary to the Release
    if: needs.build-unsigned.outputs.publishing == 'true'
    needs: [build-unsigned, sign-and-notarize]
    # Only downloads and uploads the artifact, so it does not need a Mac.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: langsmith-claude-code-tracing-darwin-arm64-unsigned
          path: bin
      - name: Attach the Binary to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSET_NAME: langsmith-claude-code-tracing-darwin-arm64-${{ github.ref_name }}
        run: |
          mv bin/langsmith-claude-code-tracing "bin/$ASSET_NAME"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "bin/$ASSET_NAME" --clobber
          else
            case "$GITHUB_REF_NAME" in
              *-*) PRERELEASE=true ;;
              *) PRERELEASE=false ;;
            esac
            gh release create "$GITHUB_REF_NAME" "bin/$ASSET_NAME" \
              --draft \
              --verify-tag \
              --generate-notes \
              --prerelease="$PRERELEASE"
          fi
