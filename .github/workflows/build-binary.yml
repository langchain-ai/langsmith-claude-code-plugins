name: Build Binary

on:
  # The only way to publish. A tag push deliberately does not trigger this.
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/build-binary.yml
      - install.sh
      - package.json
      - macos-entitlements.plist
      - scripts/build.binary.mjs
      - scripts/sign.binary.mjs
      - src/build-binary.test.ts
      - src/hooks/dispatch.ts
      - src/hooks/dispatch.binary.test.ts
      - src/hooks/stand-down.ts
      - hooks/hooks.binary.json
      - src/install-binary.test.ts
      - src/installer.ts
      - src/binary-constants.ts
      - src/binary-models.ts
      - src/binary-runtime.ts
      - src/sign-binary.test.ts
      - src/updater.ts
      - src/updater-download.ts
      - src/updater-install.ts
      - src/updater-releases.ts
      - src/updater-utils.ts
      - src/utils/stdin.ts

permissions:
  contents: read

jobs:
  build-unsigned:
    name: Build the Unsigned Binaries
    runs-on: macos-26
    outputs:
      publishing: ${{ steps.release-gate.outputs.publishing }}
    steps:
      - name: Decide Whether the Build Is Being Released
        id: release-gate
        env:
          PUBLISHING: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: echo "publishing=$PUBLISHING" >> "$GITHUB_OUTPUT"
      - name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the Version Against the Tag
        if: steps.release-gate.outputs.publishing == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if [ "$VERSION" != "$TAG" ]; then
            echo "package.json is $VERSION but the tag is $TAG. Bump the version, then retag." >&2
            exit 1
          fi
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.2
          architecture: arm64
          cache: pnpm
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the Unsigned Binaries
        run: pnpm build:binary -- --arch=all
      - name: Test the Binary
        run: pnpm test src/build-binary.test.ts src/hooks/dispatch.binary.test.ts src/install-binary.test.ts
      - name: Upload the arm64 Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: langsmith-claude-code-tracing-darwin-arm64-unsigned
          path: bin/langsmith-claude-code-tracing
          if-no-files-found: error
      - name: Upload the x64 Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: langsmith-claude-code-tracing-darwin-x64-unsigned
          path: bin/darwin-x64/langsmith-claude-code-tracing
          if-no-files-found: error

  run-on-intel:
    name: Run the x64 Binary on Intel
    needs: build-unsigned
    runs-on: macos-26-intel
    steps:
      - name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.2
          architecture: x64
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the Unsigned Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: langsmith-claude-code-tracing-darwin-x64-unsigned
          path: bin
      - name: Restore the Executable Bit
        run: chmod +x bin/langsmith-claude-code-tracing
      - name: Test the Binary
        run: pnpm test src/build-binary.test.ts src/hooks/dispatch.binary.test.ts src/install-binary.test.ts

  sign-and-notarize:
    name: Sign and Notarize the ${{ matrix.arch }} Binary
    if: needs.build-unsigned.outputs.publishing == 'true'
    needs: build-unsigned
    runs-on: ${{ matrix.runner }}
    environment: macos-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x64
            runner: macos-26-intel
    steps:
      - name: Check Out the Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.2
          architecture: ${{ matrix.arch }}
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the Unsigned Binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: langsmith-claude-code-tracing-darwin-${{ matrix.arch }}-unsigned
          path: bin
      - name: Restore the Executable Bit
        run: chmod +x bin/langsmith-claude-code-tracing
      - name: Sign and Notarize the Binary
        run: pnpm sign:binary
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
      - name: Test the Signed Binary
        run: pnpm test src/build-binary.test.ts src/hooks/dispatch.binary.test.ts src/install-binary.test.ts
      - name: Upload the Signed Binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: langsmith-claude-code-tracing-darwin-${{ matrix.arch }}-signed
          path: bin/langsmith-claude-code-tracing
          if-no-files-found: error

  publish:
    name: Publish the Binaries to the Release
    if: needs.build-unsigned.outputs.publishing == 'true'
    needs: [build-unsigned, run-on-intel, sign-and-notarize]
    # Only downloads and uploads the artifacts, so it does not need a Mac.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the Signed Binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: langsmith-claude-code-tracing-darwin-*-signed
          path: signed
      - name: Attach the Binaries to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          ASSETS=()
          for ARCH in arm64 x64; do
            ASSET_NAME="langsmith-claude-code-tracing-darwin-$ARCH-$TAG"
            mv "signed/langsmith-claude-code-tracing-darwin-$ARCH-signed/langsmith-claude-code-tracing" "release/$ASSET_NAME"
            ASSETS+=("release/$ASSET_NAME")
          done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            case "$TAG" in
              *-*) PRERELEASE=true ;;
              *) PRERELEASE=false ;;
            esac
            gh release create "$TAG" "${ASSETS[@]}" \
              --draft \
              --verify-tag \
              --generate-notes \
              --prerelease="$PRERELEASE"
          fi
