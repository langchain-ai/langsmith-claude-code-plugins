name: Engine Validation

on:
  workflow_dispatch:
    inputs:
      lifecycle_only:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  engine:
    name: Engine on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.8.2
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: runner.os == 'macOS'
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: git diff --exit-code -- bundle/ plugins/langsmith-gateway/bundle/
      - run: node .github/scripts/test-engine.mjs
        if: ${{ !inputs.lifecycle_only }}
      - run: node .github/scripts/test-engine.mjs src/hooks/mute-lifecycle.integration.test.ts
        if: ${{ inputs.lifecycle_only }}
