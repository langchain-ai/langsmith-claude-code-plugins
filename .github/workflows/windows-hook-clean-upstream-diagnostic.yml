name: Windows Hook Clean Upstream Diagnostic

on:
  push:
    branches:
      - erick/claude-windows-hook-clean-upstream-diagnostic

permissions:
  contents: read

jobs:
  hook:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run bounded hook command test
        run: node .github/scripts/test-engine.mjs src/hook-command.test.ts
        timeout-minutes: 3
